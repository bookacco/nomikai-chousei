<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飲み会調整</title>
<style>
  :root{
    --bg:#f6f3ee; --card:#fffdf9; --ink:#2b2622; --sub:#7a7068; --line:#e7e0d6;
    --accent:#b5442e; --accent-soft:#f7e4de; --lead:#fbefe0; --dot:#b5442e; --me:#fff6d6;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif}
  main{max-width:560px;margin:0 auto;padding:12px 12px 24px}
  header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 2px 8px}
  h1{font-size:1.15rem;margin:0;letter-spacing:.03em}
  .meta{color:var(--sub);font-size:.78rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
  .card h2{font-size:.8rem;color:var(--sub);margin:0 0 6px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
  .card h2 a{color:var(--accent);text-decoration:none;font-weight:600}

  /* ---- 回答フォーム ---- */
  .lbl{font-size:.72rem;color:var(--sub);margin:0 0 4px}
  input[type=text]{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:16px;background:#fff}
  .mb{margin-bottom:8px}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
  .opt-btn{position:relative;padding:7px 3px;font:inherit;font-size:.8rem;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);cursor:pointer;line-height:1.25;text-align:center}
  .opt-btn small{display:block;font-size:.62rem;color:var(--sub);font-weight:400}
  .opt-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .opt-btn:disabled{opacity:.4;cursor:default}
  .opt-btn.add{border-style:dashed;color:var(--sub)}
  .opt-btn .x{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--sub);color:#fff;font-size:11px;line-height:18px}
  .stores{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
  .store{position:relative;display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .store .ck{flex-shrink:0;width:18px;height:18px;border:1.5px solid #cfc6ba;border-radius:5px;margin-top:1px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
  .store[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .store[aria-checked="true"] .ck{background:var(--accent);border-color:var(--accent)}
  .store[aria-checked="true"] .ck::after{content:"✓"}
  .store[aria-disabled="true"]{opacity:.45;cursor:default}
  .store:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .store .bd{flex:1;min-width:0}
  .store .nm{font-weight:700;font-size:.9rem}
  .store .nm small{font-weight:400;font-size:.66rem;color:var(--sub);margin-left:6px}
  .store a{font-size:.68rem;color:var(--accent);margin-left:6px;white-space:nowrap}
  .store p{margin:2px 0 0;font-size:.72rem;color:var(--sub);line-height:1.45}
  .store .x{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--sub);color:#fff;font-size:12px;line-height:20px;text-align:center}
  .add-store{width:100%;padding:8px;border:1px dashed #cfc6ba;border-radius:9px;background:none;color:var(--sub);font:inherit;font-size:.8rem;cursor:pointer;margin-bottom:6px}
  .propose{display:flex;gap:6px;margin-bottom:8px}
  [hidden]{display:none!important}
  .propose button{flex-shrink:0;padding:0 12px;border:none;border-radius:9px;background:var(--ink);color:#fff;font:inherit;font-size:.82rem;cursor:pointer}
  .submit{width:100%;padding:11px;border:none;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  .submit:disabled{opacity:.5}
  .msg{font-size:.78rem;min-height:1.2em;margin:6px 2px 0;color:var(--sub)}
  .msg.err{color:var(--accent)}

  /* ---- 集計マトリクス（調整さん風） ---- */
  .mx{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
  table{border-collapse:collapse;font-size:.82rem}
  th,td{padding:3px 2px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  th.opt,td.opt{text-align:left;position:sticky;left:0;z-index:1;background:var(--card);padding-left:4px;padding-right:6px;min-width:7.5em}
  thead th{font-weight:600;font-size:.72rem;color:var(--sub);vertical-align:bottom}
  thead th.p{cursor:pointer;writing-mode:vertical-rl;text-orientation:upright;padding:4px 0;line-height:1.9em;font-size:.74rem;color:var(--ink);width:1.9em}
  thead th.p.me{background:var(--me)}
  td.n{width:2.6em;font-weight:700;font-variant-numeric:tabular-nums}
  td.c{min-width:1.7em;color:var(--dot);font-size:.8rem;line-height:1.5}
  td.c.me{background:var(--me)}
  td.opt small{color:var(--sub);font-size:.62rem;margin-left:3px}
  tr.grp td{border-bottom:none;padding:5px 4px 0;font-size:.68rem;color:var(--sub);text-align:left;background:none}
  tr.lead td{background:var(--lead)}
  tr.lead td.opt{background:var(--lead);font-weight:700}
  tr.lead td.n span{display:inline-block;min-width:1.7em;border-radius:9px;background:var(--accent);color:#fff;padding:0 5px}
  .legend{font-size:.66rem;color:var(--sub);margin:4px 2px 0}
  .legend b{display:inline-block;background:var(--accent);color:#fff;border-radius:9px;padding:0 5px;font-weight:700}
  .empty{color:var(--sub);font-size:.82rem;padding:6px 2px}
  details.cm{margin-top:6px;font-size:.78rem;color:var(--sub)}
  details.cm p{margin:3px 0;color:var(--ink)}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <span class="meta" id="note"></span>
  </header>

  <!-- 回答 -->
  <form class="card" id="form" autocomplete="off">
    <h2><span>回答する</span><span id="editHint"></span></h2>
    <input type="text" class="mb" id="name" maxlength="12" placeholder="お名前" aria-label="お名前" required>
    <p class="lbl" id="monthLbl">希望月（2つまで）</p>
    <div class="seg" id="months" role="group" aria-label="希望月"></div>
    <p class="lbl" id="themeLbl">お店（2つまで）</p>
    <div class="stores" id="themes" role="group" aria-label="お店"></div>
    <button type="button" class="add-store" id="addStore">＋ ほかのお店を提案</button>
    <div class="propose" id="propose" hidden>
      <input type="text" id="propText" maxlength="15" placeholder="お店の名前（15字まで）" aria-label="提案するお店">
      <button type="button" id="propAdd">追加</button>
    </div>
    <input type="text" class="mb" id="comment" maxlength="60" placeholder="ひとこと（任意）" aria-label="ひとこと">
    <button class="submit" id="submitBtn" type="submit">送信</button>
    <p class="msg" id="msg"></p>
  </form>

  <!-- 集計 -->
  <section class="card" aria-labelledby="h-sum">
    <h2 id="h-sum"><span id="sumHead">集計</span><a href="#" id="reload">更新</a></h2>
    <div class="mx"><table id="mx"></table></div>
    <p class="legend" id="legend" hidden><b>n</b> は最多。名前をタップするとその人の回答を修正できます</p>
    <p class="empty" id="empty" hidden>まだ回答がありません。最初のひとりになってください。</p>
    <details class="cm" id="cm" hidden><summary>ひとこと</summary><div id="cmBody"></div></details>
  </section>
</main>

<script>
/* =========================================================
   ここだけ書き換えればOK
   ========================================================= */
const CONFIG = {
  title: '冬の飲み会',
  note:  '締切 10/12（日）',
  gasUrl: 'https://script.google.com/macros/s/AKfycbzu8293sbxov-a57vOzF-87gfbK8R_BxIwDwX_A1kvSAuNVtAlV8jVOFBMzOAlEM_rw/exec',
  months: ['11月', '12月', '1月'],
  maxMonths: 2,
  maxThemes: 2,
  maxProposals: 12,
  // 候補のお店（name は集計・スプレッドシートの列名になるので、公開後は変えないこと）
  themes: [
    { name: '対馬', link: 'https://tabelog.com/kyoto/A2601/A260203/26023270/', linkLabel: '食べログ',
      desc: '猪口の推し店。旬の刺身、焼魚、白子、寒鰤など、その日の良い魚を豪快に楽しめる海鮮酒場。冬の日本酒会には特に強い一軒。' },
    { name: '中華料理 千龍', link: 'https://tabelog.com/kyoto/A2601/A260203/26007658/', linkLabel: '食べログ',
      desc: '四条大宮が誇る実力派町中華。焼売、麻婆豆腐、炒飯まで大皿で遠慮なく攻めたい。気取らないのに料理はしっかり旨い、飲み会向きの名店。' },
    { name: 'ふる里', link: 'https://tabelog.com/kyoto/A2601/A260203/26009446/', linkLabel: '食べログ',
      desc: '駅前ビルの3階に潜む、四条大宮らしさ全開のディープ酒場。刺身、おでん、煮物から季節の果物サワーまで、メニューを眺めるだけでも楽しい。' },
    { name: '月夜にコメと酒', link: 'https://www.instagram.com/t.kome_sake/', linkLabel: 'Instagram',
      desc: '食堂×酒場。旬の肴と日本酒、最後は羽釜炊きの銀シャリ。老舗系とは違う「今の四条大宮」を感じる良酒場。料理が丁寧で、落ち着いて飲みたい夜にも◎。' },
  ],
};
/* ========================================================= */

const KEY = '希望月';               // GAS側の列名（日付:希望月）
const $ = (id) => document.getElementById(id);
const store = { get(k){ try{return JSON.parse(localStorage.getItem(k))}catch(e){return null} },
                set(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} } };
const cache = store.get('nomikai:cache2') || {};
let answers = cache.answers || [];
let proposals = cache.proposals || [];     // [{name, by}]
let pending = [];                           // この画面で追加した未送信の提案
let myName = store.get('nomikai:me') || '';
let pickMonths = [], pickThemes = [];
const splitM = (v) => String(v || '').split(',').filter(Boolean);

document.title = CONFIG.title;
$('title').textContent = CONFIG.title;
$('note').textContent = CONFIG.note;
$('monthLbl').textContent = `希望月（${CONFIG.maxMonths}つまで）`;
$('themeLbl').textContent = `お店（${CONFIG.maxThemes}つまで）`;

/* 企画一覧 = 既定 ＋ 提案済み ＋ 未送信の提案 */
function allThemes(withPending) {
  const list = CONFIG.themes.map(t => ({ ...t }));
  const has = (n) => list.some(t => t.name === n);
  proposals.forEach(p => { if (!has(p.name)) list.push({ name: p.name, note: `${p.by}さん提案`, proposed: true }); });
  if (withPending) pending.forEach(n => { if (!has(n)) list.push({ name: n, note: '提案（送信で確定）', pending: true }); });
  return list;
}

/* ---------- フォーム ---------- */
function renderForm() {
  $('months').innerHTML = '';
  const mFull = pickMonths.length >= CONFIG.maxMonths;
  CONFIG.months.forEach(m => {
    const on = pickMonths.includes(m);
    const b = btn(m); b.setAttribute('aria-pressed', on);
    b.disabled = mFull && !on;
    b.onclick = () => { pickMonths = on ? pickMonths.filter(x => x !== m) : pickMonths.concat(m); renderForm(); };
    $('months').appendChild(b);
  });

  $('themes').innerHTML = '';
  const full = pickThemes.length >= CONFIG.maxThemes;
  const themes = allThemes(true);
  themes.forEach(t => {
    const on = pickThemes.includes(t.name);
    const off = full && !on;
    const el = document.createElement('div');
    el.className = 'store'; el.tabIndex = 0;
    el.setAttribute('role', 'checkbox'); el.setAttribute('aria-checked', on); el.setAttribute('aria-disabled', off);
    el.innerHTML = '<span class="ck"></span><div class="bd"><div class="nm"></div></div>';
    const nm = el.querySelector('.nm'); nm.textContent = t.name;
    if (t.note) { const sm = document.createElement('small'); sm.textContent = t.note; nm.appendChild(sm); }
    if (t.link) {
      const a = document.createElement('a'); a.href = t.link; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = (t.linkLabel || 'リンク') + ' ↗'; a.onclick = (e) => e.stopPropagation(); nm.appendChild(a);
    }
    if (t.desc) { const d = document.createElement('p'); d.textContent = t.desc; el.querySelector('.bd').appendChild(d); }
    const toggle = () => {
      if (!on && full) return;
      pickThemes = on ? pickThemes.filter(x => x !== t.name) : pickThemes.concat(t.name); renderForm();
    };
    el.onclick = toggle;
    el.onkeydown = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } };
    if (t.pending) {
      const x = document.createElement('span'); x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', '提案を取り消す');
      x.onclick = (e) => { e.stopPropagation(); pending = pending.filter(n => n !== t.name); pickThemes = pickThemes.filter(n => n !== t.name); renderForm(); };
      el.appendChild(x);
    }
    $('themes').appendChild(el);
  });
  $('addStore').hidden = themes.length >= CONFIG.themes.length + CONFIG.maxProposals;
}
$('addStore').onclick = () => { $('propose').hidden = false; $('propText').focus(); };
function btn(label, note) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'opt-btn'; b.textContent = label;
  if (note) { const s = document.createElement('small'); s.textContent = note; b.appendChild(s); }
  return b;
}

function addProposal() {
  const t = $('propText').value.trim().slice(0, 15);
  if (!t) return;
  if (allThemes(true).some(x => x.name === t)) { say('同じお店がすでにあります', true); return; }
  pending.push(t);
  if (pickThemes.length < CONFIG.maxThemes) pickThemes.push(t);
  $('propText').value = ''; $('propose').hidden = true; say('');
  renderForm();
}
$('propAdd').onclick = addProposal;
$('propText').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addProposal(); } });

function loadInto(name, noScroll) {
  const p = answers.find(a => a.name === name);
  $('name').value = name;
  pickMonths = p ? splitM(p.dates[KEY]).filter(m => CONFIG.months.includes(m)).slice(0, CONFIG.maxMonths) : [];
  const names = allThemes(false).map(t => t.name);
  pickThemes = p ? p.themes.filter(n => names.includes(n)).slice(0, CONFIG.maxThemes) : [];
  $('comment').value = p ? (p.comment || '') : '';
  $('editHint').textContent = p ? `${name}さんの回答を修正中` : '';
  renderForm();
  if (p && !noScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('name').addEventListener('change', () => {
  const n = $('name').value.trim();
  if (answers.some(a => a.name === n)) loadInto(n, true); else $('editHint').textContent = '';
});

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (document.activeElement === $('propText')) return;
  const name = $('name').value.trim();
  if (!name) return say('お名前を入れてください', true);
  if (!pickMonths.length) return say('希望月を選んでください', true);
  const payload = { name, dates: { [KEY]: CONFIG.months.filter(m => pickMonths.includes(m)).join(',') }, themes: pickThemes, proposals: pending, comment: $('comment').value.trim() };
  $('submitBtn').disabled = true; say('送信中…');
  try {
    const res = await fetch(CONFIG.gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '送信に失敗しました');
    answers = json.answers; proposals = json.proposals || proposals; pending = [];
    store.set('nomikai:cache2', { answers, proposals });
    myName = name; store.set('nomikai:me', name);
    renderForm(); renderSummary();
    $('editHint').textContent = `${name}さんの回答を修正中`;
    say('送信しました。ありがとう！');
    $('h-sum').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    say('送信できませんでした：' + err.message, true);
  } finally { $('submitBtn').disabled = false; }
});
function say(t, err) { $('msg').textContent = t; $('msg').classList.toggle('err', !!err); }

/* ---------- 集計マトリクス ---------- */
function renderSummary() {
  const people = answers.slice().sort((a, b) => a.updatedAt < b.updatedAt ? -1 : 1);
  const t = $('mx'); t.innerHTML = '';
  $('empty').hidden = people.length > 0;
  $('legend').hidden = people.length === 0;
  $('sumHead').textContent = people.length ? `集計（${people.length}人回答）` : '集計';
  if (!people.length) { $('cm').hidden = true; return; }

  const head = t.createTHead().insertRow();
  head.appendChild(th('', 'opt')); head.appendChild(th('計'));
  people.forEach(p => {
    const h = th([...p.name].slice(0, 4).join(''), 'p' + (p.name === myName ? ' me' : ''));
    h.title = `${p.name}の回答を修正`;
    h.onclick = () => loadInto(p.name);
    head.appendChild(h);
  });

  const body = t.createTBody();
  const group = (label) => { const r = body.insertRow(); r.className = 'grp'; const c = r.insertCell(); c.colSpan = people.length + 2; c.textContent = label; };
  const rows = (opts, has) => {
    const counts = opts.map(o => people.filter(p => has(p, o.name)).length);
    const max = Math.max(...counts);
    opts.forEach((o, i) => {
      const r = body.insertRow();
      if (max > 0 && counts[i] === max) r.className = 'lead';
      const c0 = r.insertCell(); c0.className = 'opt'; c0.textContent = o.name;
      if (o.by) { const s = document.createElement('small'); s.textContent = '提案'; c0.appendChild(s); }
      const cn = r.insertCell(); cn.className = 'n';
      const sp = document.createElement('span'); sp.textContent = counts[i]; cn.appendChild(sp);
      people.forEach(p => { const c = r.insertCell(); c.className = 'c' + (p.name === myName ? ' me' : ''); c.textContent = has(p, o.name) ? '●' : ''; });
    });
  };
  group(`希望月（${CONFIG.maxMonths}つまで）`);
  rows(CONFIG.months.map(m => ({ name: m })), (p, m) => splitM(p.dates[KEY]).includes(m));
  group(`お店（${CONFIG.maxThemes}つまで）`);
  rows(allThemes(false).map(x => ({ name: x.name, by: !CONFIG.themes.some(c => c.name === x.name) })), (p, n) => p.themes.includes(n));

  const cs = people.filter(p => p.comment);
  $('cm').hidden = !cs.length;
  $('cmBody').innerHTML = '';
  cs.forEach(p => { const e = document.createElement('p'); e.textContent = `${p.name}：${p.comment}`; $('cmBody').appendChild(e); });
}
function th(text, cls) { const e = document.createElement('th'); e.textContent = text; if (cls) e.className = cls; return e; }

/* ---------- 読み込み ---------- */
async function load() {
  $('sumHead').textContent = answers.length ? `集計（${answers.length}人回答）… 更新中` : '集計 … 読み込み中';
  try {
    const res = await fetch(CONFIG.gasUrl);
    const json = await res.json();
    answers = json.answers || []; proposals = json.proposals || [];
    store.set('nomikai:cache2', { answers, proposals });
  } catch (err) { say('集計を読み込めませんでした。「更新」を押してください', true); }
  renderSummary();
  if (myName && !$('editHint').textContent) loadInto(myName, true); else renderForm();
}
$('reload').onclick = (e) => { e.preventDefault(); load(); };

renderSummary();      // 前回の集計を即表示
if (myName) loadInto(myName, true); else renderForm();
load();
</script>
</body>
</html>
